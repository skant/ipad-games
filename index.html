<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Touch / iPad: lock zoom, fill the notch area, enable home-screen fullscreen -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Arcade" />
    <meta name="theme-color" content="#0f1226" />
    <title>iPad Arcade</title>
    <link rel="stylesheet" href="css/common.css" />
    <style>
      .home {
        flex: 1;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        padding: 28px 22px calc(28px + var(--safe-bottom));
      }
      .hero {
        text-align: center;
        margin: 10px 0 30px;
      }
      .hero h1 {
        font-size: 2.6rem;
        margin: 0 0 6px;
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .hero p {
        color: var(--text-dim);
        margin: 0;
        font-size: 1.05rem;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 18px;
        max-width: 1000px;
        margin: 0 auto;
      }
      .card {
        position: relative;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        text-decoration: none;
        color: var(--text);
        background: var(--surface);
        border-radius: var(--radius);
        padding: 22px;
        min-height: 168px;
        box-shadow: var(--shadow);
        overflow: hidden;
        transition: transform 0.1s ease, filter 0.2s ease;
        border: 1px solid rgba(255, 255, 255, 0.05);
      }
      .card:active {
        transform: scale(0.96);
        filter: brightness(1.1);
      }
      .card .emoji {
        font-size: 3rem;
        position: absolute;
        top: 18px;
        left: 20px;
        filter: drop-shadow(0 6px 12px rgba(0, 0, 0, 0.4));
      }
      .card h3 {
        margin: 0 0 4px;
        font-size: 1.3rem;
      }
      .card span {
        color: var(--text-dim);
        font-size: 0.92rem;
      }
      .card .hs {
        position: absolute;
        top: 18px;
        right: 18px;
        font-size: 0.8rem;
        background: rgba(0, 0, 0, 0.3);
        padding: 5px 10px;
        border-radius: 999px;
        color: var(--gold);
        font-weight: 600;
      }
      .card .glow {
        position: absolute;
        inset: 0;
        background: radial-gradient(
          120% 80% at 80% 0%,
          var(--accent-glow, rgba(108, 123, 255, 0.25)),
          transparent 60%
        );
        pointer-events: none;
      }
      .empty {
        max-width: 560px;
        margin: 20px auto;
        text-align: center;
        background: var(--surface);
        border: 1px dashed rgba(255, 255, 255, 0.15);
        border-radius: var(--radius);
        padding: 40px 28px;
        color: var(--text-dim);
        line-height: 1.7;
      }
      .empty b {
        color: var(--text);
      }
      .empty code {
        background: rgba(0, 0, 0, 0.35);
        padding: 2px 8px;
        border-radius: 6px;
        color: var(--accent-2);
        font-size: 0.92em;
      }
      footer {
        text-align: center;
        color: var(--text-dim);
        font-size: 0.85rem;
        margin-top: 34px;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <div class="home no-select">
      <div class="hero">
        <h1>iPad Arcade</h1>
        <p>Tap a game to play. Built for touch.</p>
      </div>
      <div class="grid" id="grid"></div>
      <footer>
        Add to Home Screen for fullscreen play ·
        tap Share → "Add to Home Screen"
      </footer>
    </div>

    <script src="js/common.js"></script>
    <script src="js/games.js"></script>
    <script>
      const grid = document.getElementById("grid");

      if (!GAMES.length) {
        grid.innerHTML = `
          <div class="empty">
            <p>No games yet. 🎮</p>
            <p>
              Copy <code>games/_template.html</code> to a new file, then add an
              entry to <code>js/games.js</code> and it'll appear here.
            </p>
          </div>`;
      } else {
        GAMES.forEach((g) => {
          const hs = Arcade.getHighScore(g.id);
          const a = document.createElement("a");
          a.className = "card";
          a.href = g.path;
          if (g.glow) a.style.setProperty("--accent-glow", g.glow);
          a.innerHTML = `
            <div class="glow"></div>
            <div class="emoji">${g.emoji || "🎮"}</div>
            ${hs ? `<div class="hs">★ ${hs}</div>` : ""}
            <h3>${g.title}</h3>
            <span>${g.desc || ""}</span>`;
          grid.appendChild(a);
        });
      }
    </script>
  </body>
</html>
