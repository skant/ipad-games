<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#2e7d32" />
    <title>Turtle Numbers</title>
    <link rel="stylesheet" href="../css/common.css" />
    <style>
      body {
        background: linear-gradient(180deg, #b9f6ca 0%, #80d8ff 100%);
        color: #16331a;
      }
      .app-bar {
        background: rgba(255, 255, 255, 0.4);
        border-bottom: 1px solid rgba(255, 255, 255, 0.6);
        color: #1b5e20;
      }
      .app-bar h1 {
        font-size: 1.15rem;
      }
      .app-bar .stat {
        color: #1b5e20;
        font-size: 5rem;
        font-weight: 800;
        line-height: 1;
      }
      .app-bar {
        align-items: center;
      }
      .stage {
        flex-direction: column;
        gap: 12px;
        padding: 12px;
        justify-content: flex-start;
      }

      /* ---------- Turtle character (pure CSS TMNT mask) ---------- */
      .turtle-wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        margin-top: 6px;
        cursor: pointer;
      }
      .turtle {
        position: relative;
        width: clamp(130px, 30vw, 180px);
        height: clamp(130px, 30vw, 180px);
      }
      .turtle-head {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: radial-gradient(circle at 50% 38%, #8bd450, #4f9e2e 72%);
        box-shadow: inset 0 -10px 18px rgba(0, 0, 0, 0.18),
          0 10px 22px rgba(0, 0, 0, 0.25);
        transform-origin: center bottom;
      }
      /* little cheek dots */
      .turtle-head::before,
      .turtle-head::after {
        content: "";
        position: absolute;
        bottom: 26%;
        width: 14px;
        height: 10px;
        background: rgba(255, 150, 150, 0.55);
        border-radius: 50%;
      }
      .turtle-head::before { left: 22%; }
      .turtle-head::after { right: 22%; }

      .mask {
        position: absolute;
        top: 40%;
        left: -6%;
        width: 112%;
        height: 24%;
        transform: translateY(-50%);
        background: var(--mask, #3a7bd5);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 16%;
        border-radius: 8px;
        box-shadow: inset 0 -3px 6px rgba(0, 0, 0, 0.25);
        z-index: 2;
      }
      /* knotted ribbon tails on each side */
      .mask::before,
      .mask::after {
        content: "";
        position: absolute;
        top: 50%;
        width: 26px;
        height: 26px;
        background: var(--mask, #3a7bd5);
        transform: translateY(-50%) rotate(45deg);
        border-radius: 6px;
        filter: brightness(0.9);
      }
      .mask::before { left: -16px; }
      .mask::after { right: -16px; }

      .eye {
        width: 26%;
        height: 78%;
        background: #fff;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: inset 0 2px 3px rgba(0, 0, 0, 0.2);
      }
      .pupil {
        width: 42%;
        height: 52%;
        background: #14304f;
        border-radius: 50%;
        transition: transform 0.2s ease;
      }
      .mouth {
        position: absolute;
        left: 50%;
        bottom: 20%;
        transform: translateX(-50%);
        width: 40px;
        height: 22px;
        border: 5px solid #1f5a1f;
        border-top: none;
        border-radius: 0 0 44px 44px;
        z-index: 2;
      }

      /* moods */
      .turtle.happy .mouth { width: 52px; height: 28px; }
      .turtle.crying .mouth {
        border: 5px solid #1f5a1f;
        border-bottom: none;
        border-radius: 44px 44px 0 0;
        height: 14px;
        width: 30px;
        bottom: 16%;
      }
      .turtle.crying .pupil { transform: translateY(3px) scaleY(0.55); }

      .turtle.speaking:not(.crying) .turtle-head {
        animation: speakBounce 0.42s ease 2;
      }
      .turtle.crying .turtle-head { animation: cryShake 0.3s ease 4; }
      @keyframes speakBounce {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-12px); }
      }
      @keyframes cryShake {
        0%, 100% { transform: rotate(0); }
        25% { transform: rotate(-6deg); }
        75% { transform: rotate(6deg); }
      }

      .tear {
        position: absolute;
        font-size: 26px;
        z-index: 3;
        animation: tearFall 1.1s ease forwards;
      }
      @keyframes tearFall {
        0% { transform: translateY(0) scale(0.6); opacity: 0; }
        15% { opacity: 1; }
        100% { transform: translateY(80px) scale(1); opacity: 0; }
      }

      .turtle-name {
        font-weight: 800;
        font-size: 1.1rem;
        color: var(--mask, #3a7bd5);
        text-shadow: 0 1px 0 rgba(255, 255, 255, 0.6);
      }
      .tap-hint {
        font-size: 0.85rem;
        color: #2e7d32;
        opacity: 0.8;
      }

      .prompt {
        font-size: clamp(1.1rem, 4vw, 1.6rem);
        font-weight: 800;
        text-align: center;
        color: #14401a;
        margin: 2px 0;
      }

      /* ---------- Progress track (race to the star) ---------- */
      .track {
        position: relative;
        width: 100%;
        max-width: 760px;
        height: 92px;
        margin: 2px auto;
        flex: 0 0 auto;
      }
      .road {
        position: absolute;
        left: 4%;
        right: 4%;
        top: 50%;
        height: 12px;
        transform: translateY(-50%);
        background: repeating-linear-gradient(
          90deg,
          #d8b483 0 18px,
          #c9a36e 18px 22px
        );
        border-radius: 999px;
        box-shadow: inset 0 -3px 4px rgba(0, 0, 0, 0.2);
      }
      .foods {
        position: absolute;
        inset: 0;
      }
      .food {
        position: absolute;
        top: 50%;
        font-size: 24px;
        transform: translate(-50%, -62%);
        transition: transform 0.3s ease, opacity 0.3s ease;
        filter: drop-shadow(0 2px 2px rgba(0, 0, 0, 0.25));
      }
      .food.eaten {
        transform: translate(-50%, -120%) scale(0);
        opacity: 0;
      }
      .walker {
        position: absolute;
        top: 50%;
        left: 4%;
        font-size: 68px;
        transform: translate(-50%, -56%) scaleX(-1);
        transition: left 0.45s cubic-bezier(0.34, 1.4, 0.5, 1);
        z-index: 3;
        will-change: left;
        filter: drop-shadow(0 3px 3px rgba(0, 0, 0, 0.3));
      }
      .walker.hop {
        animation: hop 0.45s ease;
      }
      @keyframes hop {
        0%, 100% { margin-top: 0; }
        50% { margin-top: -16px; }
      }
      .goal-star {
        position: absolute;
        top: 50%;
        left: 96%;
        font-size: 42px;
        transform: translate(-50%, -56%);
        filter: drop-shadow(0 0 6px rgba(255, 205, 77, 0.8));
      }
      .goal-star.celebrate {
        animation: starPop 0.6s ease 2;
      }
      @keyframes starPop {
        0%, 100% { transform: translate(-50%, -56%) scale(1) rotate(0); }
        50% { transform: translate(-50%, -56%) scale(1.5) rotate(18deg); }
      }

      /* ---------- Number tiles ---------- */
      .tiles {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr)); /* always 3 per row */
        gap: clamp(12px, 3vw, 22px);
        width: 100%;
        max-width: 560px;
        margin: auto auto clamp(24px, 7vh, 80px); /* margin-top:auto pushes it lower */
      }
      .tile {
        -webkit-appearance: none;
        appearance: none;
        border: none;
        cursor: pointer;
        width: 100%;
        aspect-ratio: 1 / 1;
        border-radius: 26px;
        background: var(--c, #6c7bff);
        color: #fff;
        font-weight: 900;
        line-height: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: clamp(48px, 13vw, 104px);
        box-shadow: 0 8px 0 rgba(0, 0, 0, 0.18), 0 12px 24px rgba(0, 0, 0, 0.22);
        text-shadow: 0 3px 4px rgba(0, 0, 0, 0.25);
        touch-action: manipulation;
        transition: transform 0.08s ease;
      }
      .tile:active { transform: translateY(4px) scale(0.97); }
      .tile.correct { animation: pop 0.5s forwards; background: #45d97a !important; }
      .tile.wrong { animation: tileShake 0.45s; }
      @keyframes pop {
        0% { transform: scale(1); }
        40% { transform: scale(1.25); }
        100% { transform: scale(0); opacity: 0; }
      }
      @keyframes tileShake {
        0%, 100% { transform: translateX(0) rotate(0); }
        20% { transform: translateX(-12px) rotate(-5deg); }
        40% { transform: translateX(12px) rotate(5deg); }
        60% { transform: translateX(-9px); }
        80% { transform: translateX(9px); }
      }

      .pop-emoji {
        position: fixed;
        font-size: 42px;
        z-index: 200;
        pointer-events: none;
        animation: floatUp 1.1s ease forwards;
      }
      @keyframes floatUp {
        0% { transform: translate(0, 0) scale(0.5); opacity: 0; }
        15% { opacity: 1; }
        100% { transform: translate(var(--dx, 0), -170px) scale(1.3); opacity: 0; }
      }

      .overlay h2 { font-size: 2.2rem; }
      #emojiRow { font-size: 3rem; letter-spacing: 6px; }
    </style>
  </head>
  <body>
    <header class="app-bar">
      <button class="btn icon ghost" id="homeBtn" aria-label="Home">⬅︎</button>
      <h1>🐢 Turtle Numbers</h1>
      <div class="spacer"></div>
      <div class="stat">⭐ <b id="score">0</b></div>
      <button class="btn icon ghost" id="replayBtn" aria-label="Say it again">🔊</button>
    </header>

    <main class="stage no-select">
      <div class="turtle-wrap" id="turtleWrap">
        <div class="turtle happy" id="turtle">
          <div class="turtle-head"></div>
          <div class="mask">
            <div class="eye"><div class="pupil"></div></div>
            <div class="eye"><div class="pupil"></div></div>
          </div>
          <div class="mouth"></div>
        </div>
        <div class="turtle-name" id="turtleName">Leonardo</div>
        <div class="tap-hint">🔊 tap the turtle to hear it again</div>
      </div>

      <div class="prompt" id="prompt">Tap the number you hear!</div>

      <div class="track" id="track">
        <div class="road"></div>
        <div class="foods" id="foods"></div>
        <div class="walker" id="walker">🐢</div>
        <div class="goal-star" id="goalStar">⭐</div>
      </div>

      <div class="tiles" id="tiles"></div>

      <div class="overlay" id="overlay">
        <div id="emojiRow">🐢🔢🍕</div>
        <h2>Turtle Numbers</h2>
        <p>
          The Ninja Turtles will say a number out loud. Tap the matching number!
          Tap the turtle anytime to hear it again. Make sure the iPad volume is up.
        </p>
        <button class="btn primary" id="startBtn">Play</button>
      </div>
    </main>

    <script src="../js/common.js"></script>
    <script>
      const GAME_ID = "turtle-numbers";
      const OPTIONS = 6; // how many number tiles to choose from

      // The target is picked from a weighted pool so the trickier numbers
      // (4, 5, 6, 9) come up more often for extra practice.
      const TARGET_WEIGHTS = { 0: 1, 1: 1, 2: 1, 3: 1, 4: 3, 5: 3, 6: 3, 7: 1, 8: 1, 9: 3 };
      const TARGET_POOL = [];
      for (let n = 0; n <= 9; n++)
        for (let i = 0; i < TARGET_WEIGHTS[n]; i++) TARGET_POOL.push(n);
      function pickTarget() {
        return TARGET_POOL[Math.floor(Math.random() * TARGET_POOL.length)];
      }

      const WORDS = ["zero","one","two","three","four","five","six","seven","eight","nine"];
      const TURTLES = [
        { name: "Leonardo", color: "#2f6fe0" },
        { name: "Raphael", color: "#e23b3b" },
        { name: "Michelangelo", color: "#ff8c1a" },
        { name: "Donatello", color: "#8b5cf6" },
      ];
      const TILE_COLORS = ["#ff5d6c", "#ffb24d", "#4dd2ff", "#45d97a", "#c46cff", "#ff8cc6"];
      const PRAISE = ["Cowabunga!", "Awesome!", "Turtle power!", "Great job!", "Yeah!"];

      const els = {
        score: document.getElementById("score"),
        prompt: document.getElementById("prompt"),
        tiles: document.getElementById("tiles"),
        turtle: document.getElementById("turtle"),
        turtleWrap: document.getElementById("turtleWrap"),
        turtleName: document.getElementById("turtleName"),
        overlay: document.getElementById("overlay"),
        startBtn: document.getElementById("startBtn"),
        homeBtn: document.getElementById("homeBtn"),
        replayBtn: document.getElementById("replayBtn"),
        foods: document.getElementById("foods"),
        walker: document.getElementById("walker"),
        goalStar: document.getElementById("goalStar"),
      };

      const STEPS = 10;
      const FOOD_SET = ["🍕","🍓","🍎","🍔","🥦","🍉","🌽","🍇","🥕","🍪","🍌","🧀","🍩","🍒"];

      let target = 0;
      let score = 0;
      let busy = false;
      let turtleIdx = 0;
      let started = false;
      let progress = 0; // steps along the track (0..STEPS)
      let rebuildTrackNext = false;
      let foodEls = [];

      const randInt = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
      function shuffle(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
      }

      // ---------- Speech ----------
      let voice = null;
      function pickVoice() {
        if (!("speechSynthesis" in window)) return;
        const vs = speechSynthesis.getVoices();
        voice =
          vs.find((v) => /en[-_]US/i.test(v.lang) && /female|samantha|karen|moira|tessa/i.test(v.name)) ||
          vs.find((v) => /en[-_]US/i.test(v.lang)) ||
          vs.find((v) => /^en/i.test(v.lang)) ||
          vs[0] || null;
      }
      if ("speechSynthesis" in window) {
        pickVoice();
        speechSynthesis.onvoiceschanged = pickVoice;
      }
      let speakClear = null;
      function speak(text, { rate = 0.85, pitch = 1.25 } = {}) {
        if (!("speechSynthesis" in window)) return;
        try {
          speechSynthesis.cancel();
          const u = new SpeechSynthesisUtterance(text);
          if (voice) u.voice = voice;
          u.lang = "en-US";
          u.rate = rate;
          u.pitch = pitch;
          u.volume = 1;
          if (!els.turtle.classList.contains("crying")) {
            els.turtle.classList.add("speaking");
          }
          u.onend = () => els.turtle.classList.remove("speaking");
          clearTimeout(speakClear);
          speakClear = setTimeout(() => els.turtle.classList.remove("speaking"), 1600);
          speechSynthesis.speak(u);
        } catch (e) {}
      }
      function sayTarget() {
        speak(WORDS[target]);
      }

      // ---------- Turtle mood ----------
      function setMood(mood) {
        els.turtle.classList.remove("happy", "crying");
        if (mood === "happy") els.turtle.classList.add("happy");
        else if (mood === "crying") els.turtle.classList.add("crying");
      }
      function applyTurtle() {
        const t = TURTLES[turtleIdx];
        els.turtle.style.setProperty("--mask", t.color);
        els.turtleName.style.setProperty("--mask", t.color);
        els.turtleName.textContent = t.name;
      }
      function spawnTears() {
        const r = els.turtle.getBoundingClientRect();
        for (let i = 0; i < 2; i++) {
          const tear = document.createElement("div");
          tear.className = "tear";
          tear.textContent = "💧";
          els.turtle.appendChild(tear);
          tear.style.left = (i === 0 ? 32 : 60) + "%";
          tear.style.top = "48%";
          setTimeout(() => tear.remove(), 1200);
        }
      }

      // ---------- Celebration ----------
      function celebrateAt(cx, cy, emojis, count) {
        for (let i = 0; i < count; i++) {
          const s = document.createElement("div");
          s.className = "pop-emoji";
          s.textContent = emojis[i % emojis.length];
          s.style.left = cx + "px";
          s.style.top = cy + "px";
          s.style.setProperty("--dx", randInt(-90, 90) + "px");
          document.body.appendChild(s);
          setTimeout(() => s.remove(), 1150);
        }
      }
      function celebrate(el) {
        const r = el.getBoundingClientRect();
        celebrateAt(r.left + r.width / 2, r.top + r.height / 2, ["🍕", "⭐", "🎉", "🐢", "💚"], 7);
      }

      // ---------- Progress track ----------
      function walkerPct(p) {
        return 4 + (p / STEPS) * 92; // 4%..96%
      }
      function buildTrack() {
        progress = 0;
        rebuildTrackNext = false;
        els.foods.innerHTML = "";
        foodEls = [];
        for (let i = 0; i < STEPS; i++) {
          const f = document.createElement("div");
          f.className = "food";
          f.textContent = FOOD_SET[randInt(0, FOOD_SET.length - 1)];
          f.style.left = walkerPct(i + 0.5) + "%";
          els.foods.appendChild(f);
          foodEls.push(f);
        }
        positionWalker(false);
        updateFoods();
      }
      function positionWalker(animate) {
        if (!animate) els.walker.style.transition = "none";
        els.walker.style.left = walkerPct(progress) + "%";
        if (!animate) {
          void els.walker.offsetWidth; // flush so transition stays off for this set
          els.walker.style.transition = "";
        }
      }
      function updateFoods() {
        foodEls.forEach((f, i) => {
          f.classList.toggle("eaten", progress >= i + 1);
        });
      }
      function stepForward() {
        progress++;
        positionWalker(true);
        els.walker.classList.remove("hop");
        void els.walker.offsetWidth;
        els.walker.classList.add("hop");
        updateFoods();
        if (progress >= STEPS) reachStar();
      }
      function reachStar() {
        els.goalStar.classList.add("celebrate");
        const r = els.goalStar.getBoundingClientRect();
        celebrateAt(r.left + r.width / 2, r.top + r.height / 2, ["⭐", "🌟", "🎉", "🏆", "🍕"], 12);
        speak("You got the star! Cowabunga!", { rate: 0.95, pitch: 1.3 });
        rebuildTrackNext = true; // fresh journey on the next round
        setTimeout(() => els.goalStar.classList.remove("celebrate"), 1300);
      }
      function resetTrack() {
        progress = 0;
        positionWalker(true); // walk back to the start
        updateFoods(); // restore all the food
      }

      // ---------- Rounds ----------
      function renderTiles(arr) {
        els.tiles.innerHTML = "";
        arr.forEach((n, i) => {
          const b = document.createElement("button");
          b.className = "tile";
          b.style.setProperty("--c", TILE_COLORS[i % TILE_COLORS.length]);
          b.textContent = n;
          Arcade.onTap(b, () => choose(n, b));
          els.tiles.appendChild(b);
        });
      }

      function newRound() {
        busy = false;
        if (rebuildTrackNext) buildTrack(); // start a fresh track after reaching the star
        target = pickTarget();
        turtleIdx = (turtleIdx + randInt(1, TURTLES.length - 1)) % TURTLES.length;
        applyTurtle();
        setMood("happy");
        const opts = new Set([target]);
        while (opts.size < OPTIONS) opts.add(randInt(0, 9));
        renderTiles(shuffle([...opts]));
        els.prompt.textContent = "Tap the number you hear!";
        sayTarget();
      }

      function choose(n, el) {
        if (busy || !started) return;
        if (n === target) {
          busy = true;
          el.classList.add("correct");
          setMood("happy");
          Arcade.buzz(20);
          score++;
          els.score.textContent = score;
          Arcade.setHighScore(GAME_ID, score);
          celebrate(el);
          stepForward(); // turtle eats food and moves one step toward the star
          speak(`${PRAISE[randInt(0, PRAISE.length - 1)]} ${WORDS[target]}!`, { rate: 0.95, pitch: 1.35 });
          els.prompt.textContent = "🎉 " + WORDS[target].toUpperCase() + "! 🎉";
          setTimeout(newRound, 1300);
        } else {
          el.classList.add("wrong");
          setMood("crying");
          spawnTears();
          resetTrack(); // back to the start of the track
          Arcade.buzz(60);
          speak("Oh no! Try again.", { rate: 0.95, pitch: 1.0 });
          els.prompt.textContent = "Oops! Try again 💧";
          setTimeout(() => el.classList.remove("wrong"), 480);
          setTimeout(() => {
            setMood("happy");
            els.prompt.textContent = "Tap the number you hear!";
            sayTarget();
          }, 1600);
        }
      }

      // ---------- Controls ----------
      function startGame() {
        started = true;
        score = 0;
        els.score.textContent = score;
        els.overlay.classList.add("hidden");
        buildTrack();
        newRound();
      }

      els.startBtn.addEventListener("click", startGame);
      els.homeBtn.addEventListener("click", Arcade.goHome);
      els.replayBtn.addEventListener("click", () => started && sayTarget());
      Arcade.onTap(els.turtleWrap, () => started && sayTarget());

      els.score.textContent = Arcade.getHighScore(GAME_ID);
    </script>
  </body>
</html>
